<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font:15px/1.45 "Segoe UI",system-ui,sans-serif}
#box{margin:0 auto;width:max-content;max-width:540px;min-width:220px;padding:12px 16px;border-radius:14px;background:#1b2333;color:#eef1f4;box-shadow:0 8px 30px #0006}
#q{font-weight:600;color:#aab6ff}#a{margin-top:6px}
</style><div id="box"><div id="q"></div><div id="a"></div></div><script>
const $=i=>document.getElementById(i);
let S,ctx,stream,chunks=[],ready=Promise.resolve(),hideT;
const show=(q,a)=>{clearTimeout(hideT);$('q').textContent=q;$('a').textContent=a};
const done=(ms=6000)=>{hideT=setTimeout(api.hide,ms)};
api.onStatus(t=>{$('a').textContent=t});
api.onStart(()=>{ready=(async()=>{
  speechSynthesis.cancel();S=await api.settings();show('Listening…','');chunks=[];
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch{show('Microphone blocked','Allow microphone access in Windows Settings › Privacy.');return done();}
  ctx=new AudioContext({sampleRate:16000});
  const p=ctx.createScriptProcessor(4096,1,1);
  p.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  ctx.createMediaStreamSource(stream).connect(p);p.connect(ctx.destination);
})()});
api.onStop(async()=>{
  await ready;if(!stream)return;
  stream.getTracks().forEach(t=>t.stop());await ctx.close();stream=null;
  const n=chunks.reduce((a,c)=>a+c.length,0);
  if(n<8000){api.hide();return}
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let o=44;for(const c of chunks)for(const x of c){v.setInt16(o,Math.max(-1,Math.min(1,x))*32767,true);o+=2}
  show('Thinking…','');
  const out=await api.ask(buf);
  if(out.error){show('Something went wrong',out.error);return done(8000)}
  if(!out.question){show("I didn't catch that",'Hold the keys and try again.');return done(4000)}
  show(out.question,out.answer);
  const t=new SpeechSynthesisUtterance(out.answer);t.lang=S.lang;
  const vo=speechSynthesis.getVoices().find(x=>x.name===S.voice);if(vo)t.voice=vo;
  t.onend=()=>done(5000);t.onerror=()=>done(8000);speechSynthesis.speak(t);
});
</script>
